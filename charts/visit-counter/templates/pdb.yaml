{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "visit-counter.fullname" . }}
  labels:
    {{- include "visit-counter.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "visit-counter.apiSelectorLabels" . | nindent 6 }}
{{- end }}
