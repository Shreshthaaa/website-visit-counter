{{- if not .Values.redis.auth.existingSecret }}
{{- $name := printf "%s-redis" (include "visit-counter.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "visit-counter.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.redis.auth.password }}
  {{ .Values.redis.auth.secretKey }}: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- else if $existing }}
  # Keep the existing password across upgrades.
  {{ .Values.redis.auth.secretKey }}: {{ index $existing.data .Values.redis.auth.secretKey }}
  {{- else }}
  # First install: generate one.
  {{ .Values.redis.auth.secretKey }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
